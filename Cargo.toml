[package]
name = "milvago-browser-agent"
version = "0.5.50"
edition = "2024"
publish = false
license = "Apache-2.0"

[features]
# Enterprise builds only: per-model control. Its implementation is not part of this
# repository, so the feature cannot be enabled from here.
model-control = []
# Enterprise builds only: authenticate the Enterprise extension package.
enterprise-extension = []

[dependencies]
aes-gcm = "=0.10.3"
milvago-browser-engine = { path = "browser-engine", default-features = false }
base64 = "=0.22.1"
chrono = { version = "=0.4.45", features = ["serde"] }
ed25519-dalek = "=2.2.0"
fs2 = "=0.4.3"
rand = "=0.8.8"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls", "rustls-tls-native-roots"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=0.8.23"
uuid = { version = "=1.26.0", features = ["v4", "serde"] }
zeroize = "=1.9.0"
regex = "=1.13.1"
unicode-normalization = "=0.1.25"
sha2 = "=0.10.9"
unicode-security = "=0.1.2"
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }
time = "=0.3.55"

# The Unix socket peer credential, because UnixStream::peer_cred is unstable.
[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_EventLog", "Win32_System_RemoteDesktop"] }
windows-service = "=0.8.1"

[build-dependencies]
serde_json = "=1.0.151"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
strip = true
lto = "thin"
