<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Milvago Browser</title>
<script src="appearance.js"></script>
<link rel="stylesheet" href="brand.css">
<link rel="stylesheet" href="popup.css">
</head>
<body class="popup-page">
<header class="brand-row">
  <div class="wordmark"><img class="logo-dark" src="milvago-logo-horizontal-inverse.svg" alt="Milvago" width="136" height="40"><img class="logo-light" src="milvago-logo-horizontal-mono-black.svg" alt="Milvago" width="136" height="40"></div>
  <span class="section-label">Browser</span>
</header>
<main>
  <h1 id="title">Browser protection</h1>
  <section class="agent-panel" aria-labelledby="agent-label">
    <span class="section-label" id="agent-label">Local agent</span>
    <output id="status" aria-live="polite">Checking local control…</output>
  </section>
  <button id="refresh" class="primary">Refresh policy</button>
  <details class="scope-panel">
    <summary id="scope-label">Scope and privacy</summary>
    <p id="scope"></p><p id="usage"></p>
  </details>
</main>
<footer class="appearance-row"><label id="appearance-label" for="appearance">Appearance</label><select id="appearance"><option value="system">System</option><option value="dark">Dark</option><option value="light">Light</option></select></footer>
<script src="popup.js"></script>
</body>
</html>
